spring.application.name=the-full-api
server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://the-full-db.c7qw8eqkk298.ap-southeast-2.rds.amazonaws.com:3306/the_full?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

spring.datasource.username=
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

mybatis.mapper-locations=classpath:mybatis-mapper/**/*.xml
mybatis.type-aliases-package=com.example.demo.dao

spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB
server.tomcat.max-swallow-size=-1

google.cloud.vision.credentials.path=${GOOGLE_APPLICATION_CREDENTIALS:file:/opt/keys/the-full-ocr-project-f7202d1e7284.json}

documentai.project.id=
documentai.location=
#documentai.processor.id=

openai.api.key=

logging.level.root=info
logging.level.com.example=debug
logging.level.org.springframework.jdbc=debug
logging.level.org.mybatis=debug
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

# 비밀 정보는 아래 파일로 분리
spring.config.import=optional:file:/opt/thefull-config/application-secret-real.properties

server.servlet.context-path=/api

# S3 object keys preserve the legacy /image/** path without the /image/ prefix.
aws.s3.bucket=${AWS_S3_BUCKET:thefull-upload}
aws.s3.region=${AWS_REGION:ap-southeast-2}
aws.s3.key-prefix=${AWS_S3_KEY_PREFIX:uploads/image}
aws.s3.presigned-url-duration=${AWS_S3_PRESIGNED_URL_DURATION:10m}

kakao.rest-api-key=

# ERP 문의 웹훅(수신) 설정
erp.webhook.secret=

# 라우팅 기본 우선순위: user_id > position_type > department
erp.contact.routing.priority=user_id,position_type,department

# 기본 라우팅 대상(쉼표 구분).
erp.contact.routing.user-ids=
erp.contact.routing.position-types=
erp.contact.routing.departments=

# 내부 연동 전용 시크릿
internal.api.secret=

# 공공데이터 한국 공휴일 정보 조회 인증키
public-data.holiday.service-key=

# 웰스토리 SW-FD 주문API 제휴사 인증정보 (관리자에게 발급받은 OAuth client_credentials)
# client1 = 주식회사 더채움(payerCode A0275453), client2 = 더채움 위탁급식(payerCode A0195993)
