welstory.client1.id=
welstory.client1.secret=
welstory.client2.id=
welstory.client2.secret=

# 아워홈 TOS API 접속정보 (주소·더채움 사업자번호·본부사업장코드·인증값)
# 실제 값은 여기 두지 않고 application-secret-local/real.properties 에 넣어둠 (이 파일은 플레이스홀더만)
ourhome.api.base-url=
ourhome.api.tax-no=
ourhome.api.head-group-code=
ourhome.api.service-id=
ourhome.api.client-token=
ourhome.api.encrypt-seed=

# 판가 원문(약 10MB)이 SQL 디버그 로그에 그대로 찍히지 않도록 전문 저장 쿼리만 로그 레벨을 올림
logging.level.com.example.demo.mapper.AccountMapper.SupplierApiLogSave=info